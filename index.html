<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Untuk Kamu ❤️ - Special Website</title>
    <style>
        /* (SAMA KAYAK DI ATAS, GA BERUBAH) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
        .circle { position: absolute; background: rgba(255,255,255,0.1); border-radius: 50%; animation: float 20s infinite; }
        @keyframes float { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 50% { opacity: 0.5; } 100% { transform: translateY(-100vh) scale(1); opacity: 0; } }
        .heart { position: fixed; font-size: 20px; pointer-events: none; animation: floatUp 4s ease-in-out forwards; z-index: 999; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100px) rotate(360deg); opacity: 0; } }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; }
        .card { background: rgba(255,255,255,0.98); border-radius: 40px; padding: 30px 25px; margin: 30px 0; box-shadow: 0 25px 50px rgba(0,0,0,0.3); backdrop-filter: blur(5px); transition: transform 0.3s, box-shadow 0.3s; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 30px 60px rgba(0,0,0,0.4); }
        .photo-frame { text-align: center; margin-bottom: 20px; position: relative; }
        .photo { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #ff6b6b; box-shadow: 0 10px 30px rgba(0,0,0,0.2); transition: transform 0.3s, border-color 0.3s; }
        .photo:hover { transform: scale(1.05); border-color: #ff4757; }
        .photo-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,107,107,0.3), transparent); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; } 100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; } }
        .name { text-align: center; font-size: 32px; font-weight: bold; background: linear-gradient(135deg, #667eea, #764ba2, #f093fb); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; letter-spacing: 1px; }
        .quote { text-align: center; font-size: 16px; color: #888; font-style: italic; margin-bottom: 25px; }
        .love-message { background: linear-gradient(135deg, #ff9a9e, #fecfef, #ffd6e0); padding: 25px; border-radius: 25px; margin: 20px 0; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .love-message p { color: #333; font-size: 16px; line-height: 1.8; }
        .reasons { margin: 25px 0; }
        .reason-item { background: #f8f9fa; padding: 12px 18px; margin: 10px 0; border-radius: 15px; display: flex; align-items: center; gap: 12px; transition: all 0.3s; cursor: pointer; border-left: 4px solid #ff6b6b; }
        .reason-item:hover { background: #ffe0e0; transform: translateX(10px); border-left: 4px solid #ff4757; }
        .reason-icon { font-size: 24px; }
        .reason-text { font-size: 15px; color: #333; flex: 1; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 25px 0; }
        .memory { background: linear-gradient(135deg, #f5f5f5, #fff); border-radius: 20px; overflow: hidden; text-align: center; padding: 15px; transition: all 0.3s; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .memory:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 25px rgba(0,0,0,0.2); background: linear-gradient(135deg, #ffe0e0, #fff); }
        .memory-emoji { font-size: 40px; margin-bottom: 10px; }
        .memory-text { font-size: 12px; color: #666; font-weight: 500; }
        .btn-love { background: linear-gradient(135deg, #ff6b6b, #ee5a5a, #ff4757); color: white; border: none; padding: 16px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; transition: all 0.3s; margin: 20px 0; position: relative; overflow: hidden; }
        .btn-love::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: left 0.5s; }
        .btn-love:hover::before { left: 100%; }
        .btn-love:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(255,107,107,0.4); }
        .music-player { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 25px; padding: 20px; margin: 20px 0; color: white; text-align: center; }
        .music-title { font-size: 14px; margin-bottom: 12px; opacity: 0.9; letter-spacing: 1px; }
        .music-controls { display: flex; justify-content: center; gap: 20px; margin: 15px 0; }
        .music-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .music-btn:hover { background: #ff6b6b; transform: scale(1.05); }
        audio { width: 100%; border-radius: 10px; margin-top: 10px; }
        .counter { text-align: center; font-size: 13px; color: #999; margin-top: 20px; display: flex; justify-content: center; gap: 30px; }
        .counter-item { display: flex; align-items: center; gap: 5px; }
        .countdown { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 25px; padding: 20px; margin: 20px 0; text-align: center; color: white; }
        .countdown-title { font-size: 14px; margin-bottom: 15px; opacity: 0.9; }
        .countdown-numbers { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .countdown-box { text-align: center; background: rgba(255,255,255,0.2); padding: 10px 15px; border-radius: 15px; min-width: 70px; }
        .countdown-value { font-size: 28px; font-weight: bold; }
        .countdown-label { font-size: 10px; margin-top: 5px; opacity: 0.8; }
        .love-meter { margin: 20px 0; text-align: center; }
        .meter-bar { background: #e0e0e0; border-radius: 20px; height: 20px; overflow: hidden; margin-top: 10px; }
        .meter-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff6b6b, #ff4757); border-radius: 20px; animation: fillLove 2s ease-out; }
        @keyframes fillLove { 0% { width: 0%; } 100% { width: 100%; } }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; border-radius: 30px; padding: 30px; max-width: 300px; text-align: center; animation: modalPop 0.3s ease-out; }
        @keyframes modalPop { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @media (max-width: 500px) { .container { padding: 15px; } .name { font-size: 26px; } .gallery { grid-template-columns: repeat(2, 1fr); } .countdown-numbers { gap: 10px; } .countdown-box { min-width: 60px; padding: 8px 12px; } .countdown-value { font-size: 22px; } }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnimation"></div>

<div class="container">
    <div class="card">
        <div class="photo-frame">
            <div class="photo-glow"></div>
            <img src="https://files.catbox.moe/nqfke5.jpg" alt="Foto Kamu" class="photo" id="profilePhoto">
        </div>
        <div class="name">Untuk <span id="girlName">Khotimah</span> <span style="display: inline-block; animation: pulse 1s infinite;">❤️</span></div>
        <div class="quote">"Every love story is beautiful, but ours is my favorite"</div>
        <div class="love-message" id="loveMessage"></div>
        <div class="countdown">
            <div class="countdown-title">❤️ Waktu Bersama Kita ❤️</div>
            <div class="countdown-numbers">
                <div class="countdown-box"><div class="countdown-value" id="days">0</div><div class="countdown-label">Hari</div></div>
                <div class="countdown-box"><div class="countdown-value" id="hours">0</div><div class="countdown-label">Jam</div></div>
                <div class="countdown-box"><div class="countdown-value" id="minutes">0</div><div class="countdown-label">Menit</div></div>
                <div class="countdown-box"><div class="countdown-value" id="seconds">0</div><div class="countdown-label">Detik</div></div>
            </div>
        </div>
        <div class="love-meter"><div>💕 Love Meter 💕</div><div class="meter-bar"><div class="meter-fill"></div></div><div style="font-size: 12px; margin-top: 5px;">100% Unlimited Love!</div></div>
        <div class="reasons" id="reasonsContainer"></div>
        <div class="gallery" id="galleryContainer"></div>
        <div class="music-player">
            <div class="music-title">🎵 Lagu Spesial Untukmu 🎵</div>
            <div class="music-controls"><button class="music-btn" onclick="playMusic()">▶ Play</button><button class="music-btn" onclick="pauseMusic()">⏸ Pause</button></div>
            <audio id="bgMusic" loop><source src="https://files.catbox.moe/gwdm5t.mp3" type="audio/mpeg"></audio>
        </div>
        <button class="btn-love" id="surpriseBtn">✨ Klik untuk Kejutan Spesial ✨</button>
        <div class="counter"><div class="counter-item">❤️ Dilihat <span id="visitCount">0</span> kali</div><div class="counter-item">💖 Total Kejutan <span id="surpriseCount">0</span></div></div>
    </div>
</div>

<div id="surpriseModal" class="modal">
    <div class="modal-content">
        <div id="surpriseText" style="font-size: 24px; margin-bottom: 15px;">💖</div>
        <div id="surpriseMessage" style="font-size: 18px; margin-bottom: 20px;">Aku Sayang Kamu!</div>
        <button class="music-btn" onclick="closeModal()" style="background: #ff6b6b; color: white;">Tutup</button>
    </div>
</div>

<script>
    // ========== EDIT DI SINI! ==========
    const girlName = "Khotimah";
    const startDate = new Date(2025, 4, 6);
    const loveMessage = `Hayooo, ini buat kamu! 💕\n\nAku gak tahu masa depan bakal kayak gimana, tapi aku tahu aku mau masa depanku sama kamu. 👫\n\nI LOVE YOU! 💖`;
    const reasons = ["💖 Kamu selalu ada buat aku", "🌞 Senyumanmu mencerahkan hari aku", "🎀 Kamu orangnya paling perhatian", "🍿 Seru banget kalau nonton bareng kamu", "💪 Kamu selalu support aku", "😊 Kamu bisa bikin aku happy setiap saat", "💭 Setiap hari mikirin kamu terus", "❤️ Karena kamu adalah kamu, gak ada yang bisa ganti"];
    const memories = [{ emoji: "🎂", text: "Ulang Tahun" }];
    const profilePhoto = "https://files.catbox.moe/nqfke5.jpg";
    const musicUrl = "https://files.catbox.moe/gwdm5t.mp3";
    const surprises = [{ emoji: "💖", message: "Aku Sayang Kamu! 💖" }, { emoji: "✨", message: "Kamu Bikin Hidupku Indah ✨" }, { emoji: "🌹", message: "Kamu yang Terbaik! 🌹" }, { emoji: "💕", message: "Love You More Than Anything! 💕" }, { emoji: "🌟", message: "Kamu Istimewa! 🌟" }, { emoji: "🎀", message: "Gak Ada yang Kayak Kamu 🎀" }, { emoji: "💭", message: "Selalu Ada di Pikiran 💭" }, { emoji: "🌼", message: "Kamu Cantik Kayak Bunga 🌼" }, { emoji: "🦋", message: "Kamu Membuatku Bahagia 🦋" }, { emoji: "⭐", message: "Kamu adalah Bintangku ⭐" }];
    // ========== JANGAN DIUBAH ==========
    document.getElementById('girlName').innerText = girlName;
    document.getElementById('loveMessage').innerHTML = loveMessage.replace(/\n/g, '<br>');
    document.getElementById('profilePhoto').src = profilePhoto;
    const audio = document.getElementById('bgMusic');
    audio.src = musicUrl;
    function playMusic() { audio.play(); }
    function pauseMusic() { audio.pause(); }
    document.body.addEventListener('click', () => { audio.play().catch(() => {}); }, { once: true });
    const reasonsContainer = document.getElementById('reasonsContainer');
    reasons.forEach(reason => { const item = document.createElement('div'); item.className = 'reason-item'; item.innerHTML = `<div class="reason-icon">❤️</div><div class="reason-text">${reason}</div>`; reasonsContainer.appendChild(item); });
    const galleryContainer = document.getElementById('galleryContainer');
    memories.forEach(memory => { const item = document.createElement('div'); item.className = 'memory'; item.innerHTML = `<div class="memory-emoji">${memory.emoji}</div><div class="memory-text">${memory.text}</div>`; galleryContainer.appendChild(item); });
    function updateCountdown() { const now = new Date(); const diff = now - startDate; document.getElementById('days').innerText = Math.floor(diff / (1000*60*60*24)); document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000); document.getElementById('minutes').innerText = Math.floor((diff % 3600000) / 60000); document.getElementById('seconds').innerText = Math.floor((diff % 60000) / 1000); }
    updateCountdown(); setInterval(updateCountdown, 1000);
    for(let i = 0; i < 15; i++) { const circle = document.createElement('div'); circle.className = 'circle'; circle.style.width = Math.random() * 100 + 50 + 'px'; circle.style.height = circle.style.width; circle.style.left = Math.random() * 100 + '%'; circle.style.animationDuration = Math.random() * 10 + 10 + 's'; circle.style.animationDelay = Math.random() * 10 + 's'; document.getElementById('bgAnimation').appendChild(circle); }
    function createHeart() { const heart = document.createElement('div'); heart.className = 'heart'; heart.innerHTML = ['❤️', '💖', '💕', '💗', '💓', '💘', '💝', '💟'][Math.floor(Math.random() * 8)]; heart.style.left = Math.random() * 100 + '%'; heart.style.fontSize = (Math.random() * 25 + 15) + 'px'; heart.style.animationDuration = (Math.random() * 3 + 3) + 's'; document.body.appendChild(heart); setTimeout(() => heart.remove(), 4000); }
    setInterval(createHeart, 400);
    let surpriseCount = localStorage.getItem('surpriseCount') || 0;
    document.getElementById('surpriseCount').innerText = surpriseCount;
    const modal = document.getElementById('surpriseModal'); const surpriseText = document.getElementById('surpriseText'); const surpriseMessage = document.getElementById('surpriseMessage');
    function closeModal() { modal.style.display = 'none'; }
    document.getElementById('surpriseBtn').addEventListener('click', () => { const random = surprises[Math.floor(Math.random() * surprises.length)]; surpriseText.innerHTML = random.emoji; surpriseMessage.innerHTML = random.message; modal.style.display = 'flex'; surpriseCount++; localStorage.setItem('surpriseCount', surpriseCount); document.getElementById('surpriseCount').innerText = surpriseCount; for(let i = 0; i < 15; i++) setTimeout(() => createHeart(), i * 50); });
    modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });
    let visitCount = localStorage.getItem('visitCount') || 0; visitCount++; localStorage.setItem('visitCount', visitCount); document.getElementById('visitCount').innerText = visitCount;
    const meterFill = document.querySelector('.meter-fill'); meterFill.style.width = '0%'; setTimeout(() => { meterFill.style.width = '100%'; }, 100);
</script>
</body>
</html>
